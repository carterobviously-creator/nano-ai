<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NanoAI</title>
<style>*{box-sizing:border-box}body{margin:0;background:#060912;color:#edf7ff;font:15px system-ui;height:100vh;display:flex;flex-direction:column}.top{padding:14px 18px;border-bottom:1px solid #18324a;background:#09111d}.top b{color:#67e8f9;font-size:19px}.top span{float:right;color:#8ba6bb}.chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.m{max-width:780px;padding:12px 15px;border-radius:16px;white-space:pre-wrap;line-height:1.45}.ai{background:#0e1928;border:1px solid #193650}.user{align-self:flex-end;background:#123e58;border:1px solid #1d698f}.bottom{padding:14px;background:#09111d;border-top:1px solid #18324a}.row{max-width:900px;margin:auto;display:flex;gap:9px}textarea{flex:1;resize:none;background:#0d1825;color:white;border:1px solid #24445d;border-radius:14px;padding:13px;outline:none;min-height:52px}button{background:#31d7ed;color:#031015;border:0;border-radius:14px;padding:0 20px;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.progress{height:3px;background:#102335}.progress i{display:block;height:100%;width:0;background:#31d7ed;transition:.15s}</style></head>
<body><div class="top"><b>NanoAI</b><span id="status">Starting WASM model…</span></div><div class="progress"><i id="p"></i></div><main id="chat" class="chat"><div class="m ai">Loading the local model into RAM. This build deliberately uses CPU/WASM + uint8, not WebGPU.</div></main><div class="bottom"><div class="row"><textarea id="input" disabled placeholder="Message NanoAI…"></textarea><button id="send" disabled>Send</button></div></div>
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
env.allowLocalModels=false;
const $=x=>document.getElementById(x), status=$('status'), bar=$('p'), input=$('input'), send=$('send'), chat=$('chat');
let gen=null, history=[{role:'system',content:'You are NanoAI, a concise helpful assistant.'}];
function msg(text,who){const d=document.createElement('div');d.className='m '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
try{
 gen=await pipeline('text-generation','HuggingFaceTB/SmolLM2-135M-Instruct',{device:'wasm',dtype:'uint8',progress_callback:x=>{if(x.status==='progress'&&Number.isFinite(x.progress)){bar.style.width=Math.max(0,Math.min(100,x.progress))+'%';status.textContent='Loading model… '+Math.round(x.progress)+'%'}else if(x.status==='ready')status.textContent='Preparing…';}});
 bar.style.width='100%';status.textContent='Local • WASM • uint8';input.disabled=false;send.disabled=false;input.focus();msg('Ready. No WebGPU this time. 👹🚫','ai');
}catch(e){status.textContent='Model load failed';msg('Load error: '+(e?.message||e),'ai')}
async function go(){const text=input.value.trim();if(!text||!gen)return;input.value='';input.disabled=send.disabled=true;msg(text,'user');history.push({role:'user',content:text});const bubble=msg('Thinking…','ai');
 try{const out=await gen(history,{max_new_tokens:96,do_sample:false,repetition_penalty:1.08});let answer='';const g=out?.[0]?.generated_text;if(Array.isArray(g)){const last=[...g].reverse().find(x=>x.role==='assistant');answer=last?.content||''}else if(typeof g==='string'){answer=g.replace(/^.*?<\|assistant\|>/s,'').trim()}if(!answer)answer='(No response generated.)';bubble.textContent=answer;history.push({role:'assistant',content:answer});}catch(e){bubble.textContent='Generation error: '+(e?.message||e)}finally{input.disabled=send.disabled=false;input.focus()}}
send.addEventListener('click',go);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});
</script></body></html>
