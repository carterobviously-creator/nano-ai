<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NanoAI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#07090f;
    color:white;
    font-family:system-ui,sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,#00ffff33,transparent 30%),
    radial-gradient(circle at 80% 30%,#8a2be233,transparent 30%),
    radial-gradient(circle at 50% 80%,#00ff8833,transparent 30%);
    filter:blur(80px);
    pointer-events:none;
}

.header{
    height:65px;
    backdrop-filter:blur(25px);
    background:#11182788;
    border-bottom:1px solid #ffffff11;
    display:flex;
    align-items:center;
    padding:0 20px;
    z-index:2;
}

.logo{
    width:35px;
    height:35px;
    border-radius:10px;
    background:linear-gradient(135deg,#00ffff,#7d4cff);
    margin-right:12px;
}

.title{
    font-size:20px;
    font-weight:700;
}

.status{
    margin-left:auto;
    color:#7dffb9;
    font-size:14px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:25px;
    z-index:1;
}

.message{
    max-width:750px;
    margin-bottom:20px;
    padding:15px;
    border-radius:18px;
    animation:pop .2s;
}

.user{
    background:#2563eb;
    margin-left:auto;
}

.ai{
    background:#1f2937;
    border:1px solid #ffffff10;
}

.inputArea{
    padding:20px;
    backdrop-filter:blur(20px);
    background:#11182788;
    border-top:1px solid #ffffff11;
}

.inputBox{
    max-width:900px;
    margin:auto;
    display:flex;
    gap:12px;
}

textarea{
    flex:1;
    resize:none;
    border:none;
    outline:none;
    padding:16px;
    border-radius:18px;
    background:#1f2937;
    color:white;
    min-height:58px;
    font-size:16px;
}

button{
    width:60px;
    border:none;
    cursor:pointer;
    border-radius:18px;
    background:linear-gradient(135deg,#00ffff,#7d4cff);
    color:black;
    font-size:20px;
    font-weight:bold;
}

button:hover{
    filter:brightness(1.15);
}

.loading{
    color:#00ffff;
}

@keyframes pop{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#333;
    border-radius:8px;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="header">
    <div class="logo"></div>
    <div class="title">NanoAI</div>
    <div class="status" id="status">
        Loading Model...
    </div>
</div>

<div class="chat" id="chat">
    <div class="message ai">
        Hello! Loading local AI...
    </div>
</div>

<div class="inputArea">
    <div class="inputBox">
        <textarea id="prompt"
        placeholder="Message NanoAI..."></textarea>
        <button onclick="sendMessage()">➜</button>
    </div>
</div>

<script type="module">

import { pipeline }
from "https://cdn.jsdelivr.net/npm/@xenova/transformers";

let generator;

const status=document.getElementById("status");
const chat=document.getElementById("chat");

status.textContent="Downloading Model";

generator = await pipeline(
    "text-generation",
    "Xenova/distilgpt2"
);

status.textContent="Model Loaded";

function addMessage(text,type){

    const div=document.createElement("div");

    div.className="message "+type;
    div.textContent=text;

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

    return div;
}

window.sendMessage = async ()=>{

    const box=document.getElementById("prompt");

    const prompt=box.value.trim();

    if(!prompt) return;

    addMessage(prompt,"user");

    box.value="";

    const aiBox=addMessage(
        "Thinking...",
        "ai loading"
    );

    try{

        const result=
        await generator(prompt,{
            max_new_tokens:80,
            temperature:0.7
        });

        aiBox.textContent=
        result[0].generated_text;

    }catch(err){

        aiBox.textContent=
        "Error: "+err.message;

    }
};

document
.getElementById("prompt")
.addEventListener("keydown",e=>{

    if(e.key==="Enter"&&!e.shiftKey){

        e.preventDefault();

        sendMessage();

    }

});

</script>

</body>
</html>
